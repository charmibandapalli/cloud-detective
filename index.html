<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Detective — Random Case</title>
<style>
body{font-family:Arial;margin:0;background:#0c1728;color:#edf5ff}.wrap{max-width:850px;margin:30px auto;padding:18px}.card{background:#15263d;border:1px solid #2d4563;border-radius:18px;padding:22px}.top{display:flex;gap:10px;flex-wrap:wrap}.badge{padding:8px 12px;background:#203653;border-radius:9px}.case{background:#0f1d2d;padding:18px;border-radius:14px;margin-top:16px}.clue{padding:14px;background:#172a42;border-left:4px solid #64b5f6;margin:10px 0;border-radius:8px}button{padding:12px 16px;border:1px solid #476583;border-radius:10px;background:#213a58;color:white;font-weight:bold;cursor:pointer;margin:5px}button:hover{background:#2d4e72}.good{color:#68e0aa}.bad{color:#ff9c9c}.hidden{display:none}.choices button{display:block;width:100%;text-align:left;margin:8px 0}.primary{background:#247cc5}.progress{height:8px;background:#263b55;border-radius:9px;overflow:hidden}.bar{height:100%;background:#4db6ff;width:0}
</style></head><body><div class="wrap"><div class="card">
<h1>🕵️ Cloud Detective</h1>
<p>Every player receives a randomly generated case.</p>
<div class="top"><span class="badge" id="caseNo"></span><span class="badge">❤️ <span id="lives">3</span></span><span class="badge">⭐ <span id="score">0</span></span></div>
<div class="progress" style="margin-top:14px"><div class="bar" id="bar"></div></div>
<div id="game"></div>
</div></div>
<script>
const cases=[["Linux Remote Administration", "An administrator needs secure command-line access to a remote Linux server.", "SSH", "S3"], ["Cloud Compute", "A web application requires a virtual machine in AWS.", "EC2", "Terraform"], ["Permission Control", "A company needs to control which users and services can access AWS resources.", "IAM", "EC2"], ["Infrastructure Blueprint", "A team wants to define and provision cloud infrastructure using configuration files.", "Terraform", "Ansible"], ["Remote Login Failure", "The Linux server is running, but administrators cannot remotely connect securely to it.", "SSH", "S3"], ["Missing Linux Path", "An administrator needs to discover the current working directory before navigating further.", "pwd", "IAM"], ["Configuration Automation", "A team needs to automate configuration and software setup across several servers.", "Ansible", "S3"], ["Storage Permission", "Files exist in S3, but an application role cannot read the bucket.", "IAM", "CloudWatch"], ["Silent Monitoring", "The application is running normally, but the operations team cannot see useful performance information.", "CloudWatch", "S3"], ["Wrong Directory", "An administrator needs to move into a folder named cloud on a Linux server.", "cd cloud", "CloudWatch"], ["File Listing Mystery", "An administrator needs to see the files and directories in the current Linux location.", "ls", "Terraform"], ["Infrastructure Variable", "A Terraform configuration should accept the deployment region as an input.", "Terraform variable", "Ansible Inventory"], ["Server Group", "Ansible needs a list/group describing the machines it should manage.", "Inventory", "S3"], ["Block Storage Needed", "An EC2 application needs persistent block-level storage attached to the server.", "EBS", "CloudWatch"], ["Deployment Automation", "The infrastructure must be reproducibly created from configuration instead of manual clicking.", "Terraform", "SSH"], ["Object Storage Needed", "A company needs scalable storage for uploaded images and documents as objects.", "S3", "EBS"], ["S3 Access Mystery", "Users can upload files but cannot open them. EC2 is healthy. IAM shows restricted access to the storage resource.", "IAM permissions", "CloudWatch"], ["AWS Observation", "The operations team wants metrics and monitoring information about AWS resources.", "CloudWatch", "IAM"], ["Automation Instructions", "Ansible needs an ordered set of automation tasks for deploying an application.", "Playbook", "EBS"], ["Server Needed", "A company needs a virtual compute server to run its web application.", "EC2", "IAM"]];
let idx=0,score=0,lives=3,found=[];
const game=document.getElementById("game");
function render(){
 const c=cases[Math.floor(Math.random()*cases.length)];
 document.getElementById("caseNo").textContent="CASE #"+String(Math.floor(Math.random()*900)+100);
 game.innerHTML=`<div class="case"><h2>🚨 ${c[0]}</h2><p>${c[2]}</p><div class="clue"><b>Incident:</b> ${c[1]}</div>
 <h3>Choose the technology/concept that solves the incident:</h3><div class="choices" id="choices"></div></div>`;
 let options=[c[2],c[3]];
 const pool=["EC2","S3","IAM","CloudWatch","SSH","ls","pwd","cd cloud","EBS","Terraform","Ansible","Inventory","Playbook"];
 while(options.length<4){let x=pool[Math.floor(Math.random()*pool.length)];if(!options.includes(x))options.push(x)}
 options.sort(()=>Math.random()-.5);
 options.forEach(x=>{let b=document.createElement("button");b.textContent=x;b.onclick=()=>answer(x,c[2]);document.getElementById("choices").appendChild(b)});
}
function answer(x,correct){
 if(x===correct){score+=100;document.getElementById("score").textContent=score;game.insertAdjacentHTML("beforeend",`<div class="case good"><b>✅ Correct!</b><p>${correct} solves this incident.</p><button class="primary" onclick="next()">Next Case →</button></div>`);lock()}
 else{lives--;document.getElementById("lives").textContent=lives;if(lives<=0){game.insertAdjacentHTML("beforeend",`<div class="case bad"><b>💥 Case failed.</b><p>The correct solution was ${correct}.</p><button class="primary" onclick="location.reload()">Restart</button></div>`);lock()}else{game.insertAdjacentHTML("beforeend",`<div class="case bad"><b>❌ Wrong.</b><p>You lost one life. Try again.</p>`)}}
}
function lock(){document.querySelectorAll(".choices button").forEach(b=>b.disabled=true)}
function next(){document.getElementById("bar").style.width=Math.min(100,parseInt(document.getElementById("bar").style.width||0)+20)+"%";render()}
render();
</script></body></html>
